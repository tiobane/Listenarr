name: Build Listenarr test image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      API_PROJECT: listenarr.api/Listenarr.Api.csproj
      DOCKER_OUTPUT: listenarr.api/docker-publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore .NET
        run: dotnet restore listenarr.slnx

      - name: Build solution
        run: dotnet build listenarr.slnx -c Release --no-restore

      - name: Publish API for runtime image
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${DOCKER_OUTPUT}"

          dotnet publish "${API_PROJECT}" \
            -c Release \
            -r linux-x64 \
            --no-restore \
            --self-contained false \
            /p:UseAppHost=false \
            -o "${DOCKER_OUTPUT}/amd64"

      - name: Copy tools into publish
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "${DOCKER_OUTPUT}/amd64/tools/discord-bot" ]; then
            mkdir -p "${DOCKER_OUTPUT}/amd64/tools"
            cp -r tools/discord-bot "${DOCKER_OUTPUT}/amd64/tools/"
          fi

          rm -rf "${DOCKER_OUTPUT}/amd64/tools/discord-bot/node_modules"

          test -f "${DOCKER_OUTPUT}/amd64/tools/discord-bot/package-lock.json"

      - name: Verify runtime publish
        shell: bash
        run: |
          set -euo pipefail

          test -d "${DOCKER_OUTPUT}/amd64/wwwroot"
          test -f "${DOCKER_OUTPUT}/amd64/wwwroot/placeholder.svg"
          test -d "${DOCKER_OUTPUT}/amd64/tools/discord-bot"

          echo "Runtime publish looks sane."
          ls -la "${DOCKER_OUTPUT}/amd64" | head -50

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: listenarr.api/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/tiobane/listenarr:canary
