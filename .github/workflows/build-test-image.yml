name: Build Listenarr test image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Publish Listenarr
        run: |
          dotnet publish listenarr.api/Listenarr.Api.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            /p:UseAppHost=false \
            -o listenarr.api/docker-publish/amd64

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: listenarr.api/Dockerfile.runtime
          push: true
          build-args: |
            TARGETARCH=amd64
          tags: |
            ghcr.io/tiobane/listenarr:test-1.3.4
